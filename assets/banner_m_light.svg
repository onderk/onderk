<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="600" height="520" role="img" aria-label="onderk — Power Electronics, Embedded Systems, Medical Device R&amp;D, IoT, Web, AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#e6f4f1"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891b2"/><stop offset="1" stop-color="#059669"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dfe5ec" stroke-width="0.6"/></pattern>
    <path id="bus" d="M70 330H530"/>
  </defs>
  <rect width="600" height="520" rx="18" fill="url(#bg)"/>
  <rect width="600" height="520" rx="18" fill="url(#grid)" opacity="0.5"/>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif">
    <text x="40" y="70" font-size="50" font-weight="700" fill="#1f2328">onderk</text>
    <text x="40" y="112" font-size="23" fill="url(#glow)">Power Electronics · Embedded</text>
    <text x="40" y="144" font-size="23" fill="url(#glow)">Systems · Medical Device R&amp;D</text>
    <text x="40" y="174" font-size="18" fill="#0f766e">Güç Elektroniği · Gömülü · Tıbbi Ar-Ge</text>
    <text x="40" y="210" font-size="20" fill="#4f46e5">+ IoT · Web · AI-assisted engineering</text>
    <text x="40" y="236" font-size="17" fill="#4f46e5" opacity="0.85">+ IoT · Web · Yapay zekâ destekli</text>
    <text x="40" y="266" font-size="16" fill="#57606a">33+ years / yıl · 300+ circuits / devre</text>
  </g>
  <use href="#bus" fill="none" stroke="#0d9488" stroke-width="2" opacity="0.45"/>
  <circle r="4" fill="#0e7490"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#bus"/></animateMotion></circle>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="16" fill="#57606a" text-anchor="middle">
