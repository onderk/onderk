<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="onderk — Power Electronics, Embedded Systems, Medical Device R&amp;D, IoT, Web and AI-assisted engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f2a2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1e3a44" stroke-width="0.6"/>
    </pattern>
    <!-- traces from the MCU to each skill node -->
    <path id="tPow" d="M1010 135H1050V60H1084"/>
    <path id="tIot" d="M1010 155H1084"/>
    <path id="tAi"  d="M1010 175H1050V240H1084"/>
    <path id="tWeb" d="M900 135H860V60H816"/>
    <path id="tMed" d="M900 175H860V240H816"/>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)" opacity="0.5"/>

  <!-- left: name and tagline -->
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif">
  <text x="60" y="84" font-size="50" font-weight="700" fill="#f1f5f9">onderk</text>
  <text x="60" y="120" font-size="20" fill="url(#glow)">Power Electronics · Embedded Systems · Medical Device R&amp;D</text>
  <text x="60" y="143" font-size="15" fill="#5eead4" opacity="0.85">Güç Elektroniği · Gömülü Sistemler · Tıbbi Cihaz Ar-Ge</text>
  <text x="60" y="172" font-size="15" fill="#a5b4fc">+ IoT systems · Web interfaces · AI-assisted engineering</text>
  <text x="60" y="193" font-size="13" fill="#a5b4fc" opacity="0.8">+ IoT sistemleri · Web arayüzleri · Yapay zekâ destekli mühendislik</text>
  <text x="60" y="219" font-size="13" fill="#94a3b8">33+ years / yıl · 300+ circuit designs / devre tasarımı · schematic → PCB → firmware → field</text>
  </g>

  <!-- waveform cycle: square (PWM) -> sine -> EEG, 3 s each -->
  <g transform="translate(60 248)">
    <g opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.34;1" dur="9s" repeatCount="indefinite"/>
      <path d="M0 13h36v-26h36v26h36v-26h36v26h36v-26h36v26h36v-26h36v26h36v-26h36v26h36v-26h36v26" pathLength="100" fill="none" stroke="url(#glow)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;0;0" keyTimes="0;0.2;1" dur="9s" repeatCount="indefinite"/>
      </path>
      <text x="446" y="5" font-family="Consolas,monospace" font-size="12" fill="#5eead4">PWM</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.65;0.67;1" dur="9s" repeatCount="indefinite"/>
      <path d="M0 0 q18 -26 36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0 t36 0" pathLength="100" fill="none" stroke="url(#glow)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.33;0.53;1" dur="9s" repeatCount="indefinite"/>
      </path>
      <text x="446" y="5" font-family="Consolas,monospace" font-size="12" fill="#5eead4">SINE / SİNÜS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.67;0.98;1" dur="9s" repeatCount="indefinite"/>
      <path d="M0 2.9 L3 5.3 L6 2.8 L9 5.8 L12 6.4 L15 -1.8 L18 -5.8 L21 -0.7 L24 0.8 L27 -1.5 L30 3.2 L33 7.4 L36 0.8 L39 -5.5 L42 -3.8 L45 -4.4 L48 -22.0 L51 18.0 L54 5.7 L57 5.1 L60 1.7 L63 4.2 L66 2.8 L69 -4.9 L72 -4.9 L75 2.3 L78 3.1 L81 1.3 L84 5.7 L87 6.3 L90 -2.7 L93 -7.4 L96 -4.0 L99 -4.6 L102 -6.5 L105 0.5 L108 7.1 L111 3.1 L114 -0.6 L117 1.8 L120 -0.6 L123 -6.3 L126 -2.1 L129 5.7 L132 4.9 L135 2.9 L138 6.3 L141 3.6 L144 -22.0 L147 18.0 L150 -2.8 L153 -3.4 L156 -3.8 L159 3.5 L162 6.5 L165 -0.3 L168 -3.3 L171 -0.5 L174 -3.0 L177 -5.6 L180 1.7 L183 8.4 L186 5.3 L189 3.2 L192 5.3 L195 0.3 L198 -7.9 L201 -5.9 L204 -0.2 L207 -1.4 L210 -1.0 L213 5.0 L216 3.9 L219 -4.5 L222 -5.5 L225 -1.8 L228 -3.7 L231 -3.4 L234 5.4 L237 9.5 L240 -22.0 L243 18.0 L246 3.3 L249 -2.5 L252 -7.9 L255 -2.4 L258 2.9 L261 0.4 L264 0.8 L267 4.7 L270 -0.0 L273 -8.1 L276 -6.3 L279 -1.7 L282 -3.1 L285 -0.5 L288 8.0 L291 8.4 L294 1.3 L297 0.3 L300 1.4 L303 -4.0 L306 -5.7 L309 2.1 L312 5.6 L315 1.3 L318 1.3 L321 2.8 L324 -4.1 L327 -10.1 L330 -5.2 L333 -0.5 L336 -22.0 L339 18.0 L342 8.7 L345 5.2 L348 -2.1 L351 -1.2 L354 0.3 L357 -3.8 L360 -2.0 L363 6.4 L366 6.8 L369 0.8 L372 0.6 L375 0.3 L378 -7.3 L381 -9.9 L384 -2.5 L387 1.3 L390 -0.5 L393 3.3 L396 7.1 L399 0.7 L402 -5.2 L405 -1.6 L408 0.4 L411 -2.1 L414 2.2 L417 9.4 L420 6.0 L423 -0.8 L426 -0.7 L429 -2.0 L432 -22.0" pathLength="100" fill="none" stroke="url(#glow)" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100">
        <animate attributeName="stroke-dashoffset" values="100;100;0;0" keyTimes="0;0.66;0.86;1" dur="9s" repeatCount="indefinite"/>
      </path>
      <text x="446" y="5" font-family="Consolas,monospace" font-size="12" fill="#5eead4">EEG</text>
    </g>
  </g>

  <!-- traces -->
  <g fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.45">
    <use href="#tPow"/><use href="#tIot"/><use href="#tAi"/><use href="#tWeb"/><use href="#tMed"/>
  </g>

  <!-- data packets travelling out of the MCU -->
  <g fill="#67e8f9">
    <circle r="3.5"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#tPow"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite"><mpath href="#tIot"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1s" repeatCount="indefinite"><mpath href="#tAi"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite"><mpath href="#tWeb"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="2.4s" begin="2s" repeatCount="indefinite"><mpath href="#tMed"/></animateMotion></circle>
  </g>

  <!-- MCU chip -->
  <g transform="translate(900 120)">
    <rect width="110" height="70" rx="7" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="3">
      <path d="M15 0V-9M35 0V-9M55 0V-9M75 0V-9M95 0V-9M15 70V79M35 70V79M55 70V79M75 70V79M95 70V79"/>
    </g>
    <text x="55" y="33" text-anchor="middle" font-family="Consolas,monospace" font-size="15" fill="#67e8f9">MCU</text>
    <text x="55" y="52" text-anchor="middle" font-family="Consolas,monospace" font-size="10" fill="#64748b">PIC·ESP32·STM32</text>
  </g>

  <!-- skill nodes -->
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    <!-- Power -->
    <circle cx="1110" cy="60" r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <path d="M1114 45L1100 63H1110L1106 76L1120 57H1110Z" fill="#f59e0b">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <text x="1110" y="101">Power / Güç</text>

    <!-- IoT -->
    <circle cx="1110" cy="155" r="26" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <circle cx="1110" cy="166" r="3" fill="#34d399"/>
    <g fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round">
      <path d="M1102 158Q1110 151 1118 158"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="1.8s" repeatCount="indefinite"/></path>
      <path d="M1096 151Q1110 139 1124 151"><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.35;0.8;1" dur="1.8s" repeatCount="indefinite"/></path>
    </g>
    <text x="1110" y="196">IoT</text>

    <!-- AI -->
    <circle cx="1110" cy="240" r="26" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>
    <g stroke="#a78bfa" stroke-width="1.5"><path d="M1098 230L1122 240M1098 250L1122 240M1098 230L1110 240M1098 250L1110 240M1110 240H1122"/></g>
    <g fill="#c4b5fd">
      <circle cx="1098" cy="230" r="3.5"><animate attributeName="r" values="3.5;5;3.5" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="1098" cy="250" r="3.5"><animate attributeName="r" values="3.5;5;3.5" dur="1.4s" begin="0.45s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="240" r="3"/>
      <circle cx="1122" cy="240" r="3.5"><animate attributeName="r" values="3.5;5;3.5" dur="1.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    </g>
    <text x="1110" y="282">AI / YZ</text>

    <!-- Web -->
    <circle cx="790" cy="60" r="26" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="775" y="48" width="30" height="23" rx="3" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M775 54H805" stroke="#60a5fa" stroke-width="2"/>
    <path d="M780 60H794M780 65H789" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="791" y="62" width="2" height="6" fill="#93c5fd"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <text x="790" y="101">Web</text>

    <!-- Medical -->
    <circle cx="790" cy="240" r="26" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <path d="M773 241h8l4-11l5 21l4-10h11" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0;0" keyTimes="0;0.6;1" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <text x="790" y="282">Medical / Tıbbi</text>
  </g>
</svg>
